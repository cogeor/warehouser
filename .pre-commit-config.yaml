repos:
  # All hooks use local system tools for Windows compatibility
  - repo: local
    hooks:
      # Python hooks
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd training && uv run ruff check . --fix'
        language: system
        files: ^training/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd training && uv run ruff format .'
        language: system
        files: ^training/.*\.py$
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: bash -c 'cd training && uv run mypy training tests --ignore-missing-imports'
        language: system
        files: ^training/.*\.py$
        pass_filenames: false

      # TypeScript hooks
      - id: eslint
        name: ESLint
        entry: bash -c 'cd web_frontend && npm run lint'
        language: system
        files: ^web_frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: typescript
        name: TypeScript
        entry: bash -c 'cd web_frontend && npx tsc --noEmit'
        language: system
        files: ^web_frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
