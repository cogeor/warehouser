name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python linting and type checking
  python-lint:
    name: Python Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: training
        run: uv sync --all-extras

      - name: Ruff check & format
        working-directory: training
        run: |
          # Run auto-fixers first
          uv run ruff check . --fix
          uv run ruff format .

          # Check if any files were changed
          if ! git diff --quiet; then
            echo "::error::Python files need formatting. Run 'cd training && uv run ruff check . --fix && uv run ruff format .' locally."
            echo ""
            echo "Files that need changes:"
            git diff --name-only
            echo ""
            echo "Diff:"
            git diff
            exit 1
          fi
          echo "All Python files are properly formatted!"

      - name: Mypy
        working-directory: training
        run: uv run mypy training tests --ignore-missing-imports

  # TypeScript linting and type checking
  typescript-lint:
    name: TypeScript Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_frontend/package-lock.json

      - name: Install dependencies
        working-directory: web_frontend
        run: npm ci

      - name: ESLint
        working-directory: web_frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: web_frontend
        run: npx tsc --noEmit

  # Docker build (includes C++ compilation and tests)
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: warehouser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs: [python-lint, typescript-lint, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.python-lint.result }}" != "success" ]]; then
            echo "Python lint failed"
            exit 1
          fi
          if [[ "${{ needs.typescript-lint.result }}" != "success" ]]; then
            echo "TypeScript lint failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Docker build failed"
            exit 1
          fi
          echo "All CI jobs passed!"
