version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/training"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(python)"
    groups:
      ml-deps:
        patterns:
          - "torch*"
          - "stable-baselines3"
          - "gymnasium"
          - "onnx*"
      dev-deps:
        patterns:
          - "pytest*"
          - "mypy*"
          - "ruff*"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
