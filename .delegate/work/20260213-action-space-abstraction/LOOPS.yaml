      1. Add new section "## Action Space" under Key Conventions:

         ### Action Space Contract

         **Policy Output:**
         - Actions normalized to [-1, 1]
         - Shape: [linear_vel, angular_vel, pick, place]

         **Processing Pipeline (Python wrappers):**
         1. ActionScalingWrapper: [-1,1] -> physical velocities
         2. ActionSmoothingWrapper: EMA filter (alpha=0.3)
         3. AccelerationLimitWrapper: enforce realistic dynamics
         4. SafetyClippingWrapper: hard bounds

         **Discrete Actions:**
         - Pick/place use threshold=0.5
         - pick > 0.5 triggers pick (if not carrying)
         - place > 0.5 triggers place (if carrying)
         - Action masking prevents invalid commands

         **RLBridge Safety:**
         - Actions scaled by v_max/omega_max parameters
         - SafetyController applied before publishing
         - Safety state returned in observation

