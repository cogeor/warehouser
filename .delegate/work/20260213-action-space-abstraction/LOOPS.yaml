  - id: "02"
    summary: "Implement ActionSmoothingWrapper with EMA filter"
    scope: |
      - training/training/wrappers/action_smoothing.py (CREATE)
      - training/training/wrappers/__init__.py (MODIFY)
    commit_type: "feat"
    commit_scope: "wrappers"
    phase: "1-Wrappers"
    status: pending
    depends_on: ["01"]
    details: |
      Implement EMA-based action smoothing for velocity commands:

      1. Create ActionSmoothingWrapper(gym.ActionWrapper):
         - Constructor: (env, alpha: float = 0.3)
           - alpha in [0, 1]: 0 = max smoothing, 1 = no smoothing
         - State: prev_action: np.ndarray | None
         - action() method:
           - If prev_action is None, initialize and return raw action
           - Apply EMA: smoothed[:2] = alpha * action[:2] + (1 - alpha) * prev_action[:2]
           - Only smooth velocity (indices 0-1), not discrete actions (indices 2-3)
           - Update prev_action with smoothed result
         - reset() method:
           - Clear prev_action to None
           - Call super().reset() and return result

      2. Update __init__.py to export ActionSmoothingWrapper

  - id: "03"
    summary: "Implement AccelerationLimitWrapper for realistic dynamics"
    scope: |
      - training/training/wrappers/accel_limit.py (CREATE)
      - training/training/wrappers/__init__.py (MODIFY)
    commit_type: "feat"
    commit_scope: "wrappers"
    phase: "1-Wrappers"
    status: pending
    depends_on: ["01"]
    details: |
      Implement acceleration limiting for realistic motor dynamics:

      1. Create AccelerationLimitWrapper(gym.ActionWrapper):
         - Constructor: (env, max_delta: dict[str, float], dt: float = 0.05)
           - max_delta: {"linear": 2.0, "angular": 4.0} in m/s^2 and rad/s^2
           - dt: simulation timestep in seconds
         - State: prev_velocity = np.zeros(2, dtype=np.float32)
         - action() method:
           - Compute desired acceleration: accel = (action[:2] - prev_velocity) / dt
           - Clip acceleration to [-max_linear_accel, max_linear_accel] and [-max_angular_accel, max_angular_accel]
           - Compute clamped velocity: prev_velocity + accel * dt
           - Update prev_velocity
           - Return action with clamped velocity
         - reset() method:
           - Reset prev_velocity to zeros
           - Call super().reset() and return result

      2. Update __init__.py to export AccelerationLimitWrapper

