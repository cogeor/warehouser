  - id: "06"
    summary: "Implement buildV2 lidar-based observation method"
    scope: |
      - ros_ws/src/warehouser_observations/src/observation_builder.cpp
    commit_type: "feat"
    commit_scope: "observations"
    phase: "2-V2Lidar"
    status: pending
    depends_on: ["05"]
    details: |
      Implement buildV2 in observation_builder.cpp:

      1. Add constructor overload implementation storing lidar pointer

      2. Replace V2 fallback (lines 17-20) with: return buildV2(...)

      3. Implement buildV2() method (63 dims):
         - Get robot from findRobotByIndex
         - Get lidar scan: lidar_->scan(robot->x, robot->y, robot->theta, world)
         - Copy 60 lidar ranges to obs.data[0:60]
         - Compute ego-centric goal bearing: atan2(dy, dx) - robot->theta
         - Compute goal distance: sqrt(dx*dx + dy*dy)
         - Set is_carrying flag

      4. Handle null lidar_ pointer gracefully (fallback to V1 or zeros)

